name: Receiver
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { backend: scalar, sanitize: 'OFF', bitplane: 'OFF', prefix: 'OFF', coarse: 'OFF' }
          - { backend: scalar, sanitize: 'ON', bitplane: 'OFF', prefix: 'OFF', coarse: 'OFF' }
          - { backend: bitplane, sanitize: 'OFF', bitplane: 'ON', prefix: 'OFF', coarse: 'OFF' }
          - { backend: prefix, sanitize: 'OFF', bitplane: 'ON', prefix: 'ON', coarse: 'OFF' }
          - { backend: coarse, sanitize: 'OFF', bitplane: 'OFF', prefix: 'OFF', coarse: 'ON' }
          - { backend: survey, sanitize: 'OFF', bitplane: 'OFF', prefix: 'OFF', coarse: 'ON', survey: 'ON' }
          - { backend: compact, sanitize: 'OFF', bitplane: 'OFF', prefix: 'OFF', coarse: 'ON', survey: 'ON', compact: 'ON' }
          - { backend: ground, sanitize: 'OFF', bitplane: 'OFF', prefix: 'OFF', coarse: 'ON', ground: 'ON' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEPHEMERIS_SANITIZE=${{ matrix.sanitize }} -DEPHEMERIS_BITPLANE_TRACKING=${{ matrix.bitplane }} -DEPHEMERIS_PREFIX_SUMS=${{ matrix.prefix }} -DEPHEMERIS_COARSE_TRACKING=${{ matrix.coarse }} -DEPHEMERIS_GROUND_SEARCH=${{ matrix.ground || 'OFF' }} -DEPHEMERIS_GROUND_TROPOSPHERE=${{ matrix.ground || 'OFF' }} -DEPHEMERIS_GROUND_IONOSPHERE=${{ matrix.ground || 'OFF' }} -DEPHEMERIS_LONG_CODE_SMOOTHING=${{ matrix.ground || 'OFF' }} -DEPHEMERIS_DOPPLER_POSITION=${{ matrix.ground || 'OFF' }} -DEPHEMERIS_COMPACT_SURVEY=${{ matrix.compact || 'OFF' }} -DEPHEMERIS_MOTION_AVERAGE=${{ matrix.compact || 'OFF' }} -DEPHEMERIS_FLIGHT_SURVEY=${{ matrix.survey || 'OFF' }} -DEPHEMERIS_VELOCITY_FIT=${{ matrix.ground || matrix.survey || 'OFF' }}
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure -j 2
      - if: github.event_name == 'schedule' && matrix.backend == 'scalar' && matrix.sanitize == 'OFF'
        run: |
          mkdir -p build/evidence
          build/native/signal_test --sweep > build/evidence/sensitivity.txt
          python tests/leo_observables.py build/native/geometry_probe --full > build/evidence/leo-observables.json
          python tools/run_campaign.py build/native/eph-replay build/evidence/raw --scenario leo-550-1
      - if: always() && github.event_name == 'schedule' && matrix.backend == 'scalar' && matrix.sanitize == 'OFF'
        uses: actions/upload-artifact@v4
        with:
          name: native-replay-evidence
          path: build/evidence

  pico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: build/sdk
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@v4
        id: arm
        with:
          path: build/arm
          key: arm-gnu-14.2.rel1-x86_64-62a63b98
      - if: steps.arm.outputs.cache-hit != 'true'
        run: |
          archive=arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
          curl --fail --location --retry 3 --output "build/$archive" "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$archive"
          echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  build/$archive" | sha256sum --check
          mkdir -p build/arm
          tar -xJf "build/$archive" -C build/arm --strip-components=1
      - run: echo "$GITHUB_WORKSPACE/build/arm/bin" >> "$GITHUB_PATH"
      - run: cmake -S firmware -B build/pico -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/build/sdk" -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/pico --parallel 2
      - name: Cross-build the scalar reference
        run: |
          cmake -S firmware -B build/pico-scalar -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/build/sdk" -DCMAKE_BUILD_TYPE=Release -DEPHEMERIS_COARSE_TRACKING=OFF -DEPHEMERIS_DUAL_TRACKING=OFF
          cmake --build build/pico-scalar --target ephemeris_pico ephemeris_profile --parallel 2
      - name: Build the outdoor receiver
        run: |
          cmake -S firmware -B build/pico-ground -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/build/sdk" -DCMAKE_BUILD_TYPE=Release -DEPHEMERIS_GROUND_SEARCH=ON -DEPHEMERIS_GROUND_TROPOSPHERE=ON -DEPHEMERIS_GROUND_IONOSPHERE=ON -DEPHEMERIS_DOPPLER_POSITION=ON -DEPHEMERIS_VELOCITY_FIT=ON
          cmake --build build/pico-ground --target ephemeris_pico ephemeris_profile --parallel 2
      - name: Cross-build the experimental orbital search
        run: |
          cmake -S firmware -B build/pico-survey -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/build/sdk" -DCMAKE_BUILD_TYPE=Release -DEPHEMERIS_FLIGHT_SURVEY=ON -DEPHEMERIS_COMPACT_SURVEY=ON -DEPHEMERIS_VELOCITY_FIT=ON -DEPHEMERIS_MOTION_AVERAGE=ON
          cmake --build build/pico-survey --target ephemeris_pico ephemeris_clocked_replay --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: pico-plus-2-experimental-survey
          path: build/pico-survey/ephemeris_pico.uf2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pico-plus-2-ground-receiver
          path: build/pico-ground/ephemeris_pico.uf2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pico-plus-2-development-firmware
          path: build/pico/*.uf2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pico-plus-2-scalar-reference
          path: build/pico-scalar/*.uf2
          if-no-files-found: error
