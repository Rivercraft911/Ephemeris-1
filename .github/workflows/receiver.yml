name: Receiver
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { backend: scalar, sanitize: 'OFF', bitplane: 'OFF', prefix: 'OFF' }
          - { backend: scalar, sanitize: 'ON', bitplane: 'OFF', prefix: 'OFF' }
          - { backend: bitplane, sanitize: 'OFF', bitplane: 'ON', prefix: 'OFF' }
          - { backend: prefix, sanitize: 'OFF', bitplane: 'ON', prefix: 'ON' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEPHEMERIS_SANITIZE=${{ matrix.sanitize }} -DEPHEMERIS_BITPLANE_TRACKING=${{ matrix.bitplane }} -DEPHEMERIS_PREFIX_SUMS=${{ matrix.prefix }}
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure -j 2
      - if: github.event_name == 'schedule' && matrix.backend == 'scalar' && matrix.sanitize == 'OFF'
        run: |
          mkdir -p build/evidence
          build/native/signal_test --sweep > build/evidence/sensitivity.txt
          python tests/leo_observables.py build/native/geometry_probe --full > build/evidence/leo-observables.json
          python tools/run_campaign.py build/native/eph-replay build/evidence/raw --scenario leo-550-1
      - if: always() && github.event_name == 'schedule' && matrix.backend == 'scalar' && matrix.sanitize == 'OFF'
        uses: actions/upload-artifact@v4
        with:
          name: native-replay-evidence
          path: build/evidence

  pico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: build/sdk
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev
      - run: cmake -S firmware -B build/pico -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/build/sdk" -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/pico --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: pico-plus-2-development-firmware
          path: build/pico/*.uf2
          if-no-files-found: error
